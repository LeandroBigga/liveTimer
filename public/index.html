<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Room Timer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #e0e0e0; min-height: 100vh; }
        #topbar { background: #111; border-bottom: 1px solid #333; padding: 8px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        #topbar h1 { font-size: 16px; color: #aaa; font-weight: normal; margin-right: 8px; }
        #topbar input { background: #222; border: 1px solid #444; color: #e0e0e0; padding: 5px 10px; border-radius: 4px; font-size: 13px; width: 120px; }
        #topbar button { background: #2a2a2a; border: 1px solid #555; color: #ccc; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        #topbar button:hover { background: #333; }
        #topbar button.danger { border-color: #622; color: #e06060; }
        #topbar button.danger:hover { background: #2a1515; }
        #roomStatus { font-size: 13px; color: #888; margin-left: auto; }
        #roomsPanel { position: absolute; top: 44px; left: 16px; width: 360px; max-width: calc(100vw - 32px); background: #141414; border: 1px solid #2a2a2a; border-radius: 10px; padding: 10px; box-shadow: 0 12px 32px rgba(0,0,0,0.45); display: none; z-index: 50; }
        #roomsPanelHeader { display: flex; justify-content: space-between; align-items: center; padding: 4px 4px 10px; }
        #roomsPanelHeader b { color: #c0c0c0; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
        #roomsPanelHeader button { padding: 4px 10px; font-size: 12px; }
        .roomItem { border: 1px solid #222; border-radius: 8px; padding: 10px 10px; background: #111; margin-bottom: 8px; cursor: pointer; }
        .roomItem:hover { background: #151515; border-color: #2a2a2a; }
        .roomTop { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
        .roomCode { font-family: 'Courier New', monospace; font-size: 14px; color: #e0e0e0; }
        .roomCount { font-size: 12px; color: #777; }
        .roomUsers { margin-top: 6px; font-size: 12px; color: #777; line-height: 1.4; }
        .roomUsers span { color: #aaa; }
        #main { display: flex; height: calc(100vh - 43px); }
        #sidebar { width: 300px; min-width: 220px; background: #141414; border-right: 1px solid #2a2a2a; display: flex; flex-direction: column; overflow: hidden; }
        #stats-bar { background: #111; border-bottom: 1px solid #2a2a2a; padding: 8px 12px; display: flex; gap: 0; }
        .stat-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 2px 0; border-right: 1px solid #222; }
        .stat-item:last-child { border-right: none; }
        .stat-label { color: #555; font-size: 10px; text-transform: uppercase; }
        .stat-val { color: #c0c0c0; font-family: 'Courier New', monospace; font-size: 13px; }
        .stat-val.highlight { color: #60c0f0; }
        #sidebar-header { background: #1e1e1e; border-bottom: 1px solid #2a2a2a; padding: 5px 12px; display: grid; grid-template-columns: 32px 1fr 62px 62px 62px; font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 0.5px; font-weight: bold; }
        #sidebar-header span:not(:first-child) { text-align: right; }
        #solve-list { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #333 transparent; }
        #solve-list::-webkit-scrollbar { width: 4px; }
        #solve-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
        .solve-row { display: grid; grid-template-columns: 32px 1fr 62px 62px 62px; padding: 4px 12px; font-size: 12px; border-bottom: 1px solid #1e1e1e; font-family: 'Courier New', monospace; transition: background 0.1s; cursor: default; }
        .solve-row:hover { background: #1c1c1c; }
        .solve-row.latest { background: #162016; }
        .solve-row .num { color: #484848; font-size: 10px; padding-top: 1px; }
        .solve-row .time { color: #d0d0d0; }
        .solve-row .time.pb { color: #60c0f0; }
        .solve-row .avg { color: #777; text-align: right; }
        .solve-row .avg.best-avg { color: #f0c060; }
        .solve-row .bestcell { color: #60c0f0; text-align: right; }
        #center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px; }
        #scramble-display { font-size: 24px; color: #7ab8e8; text-align: center; max-width: 600px; line-height: 1.7; letter-spacing: 1px; }
        #timer { font-size: 150px; font-weight: bold; font-family: 'Courier New', monospace; color: #e0e0e0; transition: color 0.15s; letter-spacing: -3px; line-height: 1; }
        #timer.arming { color: #e05050; }
        #timer.ready  { color: #50e050; }
        #current-ao5 { margin-top: 6px; font-size: 16px; font-family: 'Courier New', monospace; color: #777; min-height: 20px; }
        #current-ao5 b { color: #c0c0c0; font-weight: 700; }
        #hint { font-size: 11px; color: #383838; text-transform: uppercase; letter-spacing: 2px; }
        #rightpanel { width: 240px; min-width: 180px; background: #141414; border-left: 1px solid #2a2a2a; display: flex; flex-direction: column; overflow: hidden; }
        #rightpanel-header { background: #1e1e1e; border-bottom: 1px solid #2a2a2a; padding: 8px 12px; font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 1px; }
        #users { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
        .box { background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 6px; padding: 10px 12px; }
        .box-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
        .box-title-row b { font-size: 13px; color: #ccc; margin-bottom: 0; }
        .race-badge { font-size: 10px; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0; }
        .race-badge.race-on { background: #1a3a1a; color: #8f8; border: 1px solid #4a8; }
        .race-badge.race-off { background: #222; color: #666; border: 1px solid #333; }
        .box b { font-size: 13px; color: #ccc; display: block; margin-bottom: 4px; }
        .box .scramble-text { font-size: 10px; color: #484848; word-break: break-all; line-height: 1.4; margin-bottom: 6px; }
        .box-stats { display: flex; gap: 6px; margin-bottom: 6px; }
        .box-stats span { font-size: 11px; color: #555; }
        .box-stats span b { display: inline; color: #888; font-size: 11px; }
        .box-solves { font-size: 11px; }
        .box-solve-row { display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px solid #252525; color: #555; font-family: 'Courier New', monospace; }
        .box-solve-row:first-child { color: #999; }
        .box-num { color: #383838; }
        #topbar button.active { background: #1a3a1a; border-color: #4a8; color: #8f8; }
        #topbar button.host-only { border-color: #48a; color: #7ab8e8; }
        #race-status { font-size: 12px; color: #888; width: 100%; text-align: center; }
        #race-controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
        #race-controls button { background: #2a2a2a; border: 1px solid #555; color: #ccc; padding: 8px 18px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        #race-controls button:hover { background: #333; }
        #race-controls button.ready-on { background: #1a3a1a; border-color: #4a8; color: #8f8; }
        #race-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #race-banner { font-size: 15px; color: #f0c060; min-height: 22px; text-align: center; }
        #race-results { display: none; width: 100%; max-width: 420px; background: #141414; border: 1px solid #2a2a2a; border-radius: 8px; padding: 14px 16px; }
        #race-results h3 { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; font-weight: normal; }
        .race-place { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #222; font-family: 'Courier New', monospace; font-size: 14px; }
        .race-place:last-child { border-bottom: none; }
        .race-place .place { color: #f0c060; width: 28px; }
        .race-place .pname { color: #ccc; flex: 1; }
        .race-place .ptime { color: #7ab8e8; }
        #race-countdown { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; align-items: center; justify-content: center; font-size: 120px; font-weight: bold; font-family: 'Courier New', monospace; color: #7ab8e8; pointer-events: none; flex-direction: column; gap: 12px; }
        #race-countdown .inspection-sub { font-size: 18px; color: #888; letter-spacing: 2px; text-transform: uppercase; }
        #inspection-hint { font-size: 14px; color: #f0c060; text-align: center; min-height: 20px; font-weight: bold; }
        #inspection-display { display: none; text-align: center; padding: 8px 16px; border-radius: 8px; background: #1a2a3a; border: 1px solid #3a5a7a; margin: 4px 0; }
        #inspection-display.penalty-phase { background: #2a2418; border-color: #7a6a3a; }
        #inspection-display .insp-num { font-size: 48px; font-weight: bold; font-family: 'Courier New', monospace; color: #7ab8e8; line-height: 1.1; }
        #inspection-display.penalty-phase .insp-num { color: #f0c060; }
        #inspection-display .insp-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 2px; margin-top: 4px; }
        #race-status.inspection-active { font-size: 15px; font-weight: bold; color: #7ab8e8; }
        #race-status.penalty-active { color: #f0c060; }
        #topbar-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        #room-actions { display: none; flex-direction: column; gap: 8px; padding: 0 8px 10px; border-bottom: 1px solid #2a2a2a; }
        #room-actions button { width: 100%; min-height: 44px; font-size: 14px; padding: 10px 14px; }
        #touch-zone { display: none; touch-action: manipulation; user-select: none; -webkit-user-select: none; cursor: pointer; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
        #touch-zone.arming { background: rgba(224,80,80,0.06); }
        #touch-zone.ready { background: rgba(80,224,80,0.06); }
        #touch-zone.running { background: rgba(255,255,255,0.02); }
        #touch-zone-label { font-size: 13px; color: #666; text-transform: uppercase; letter-spacing: 1px; text-align: center; padding: 0 12px; flex-shrink: 0; }
        #center-meta { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
        #bottom-tabs { display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 60; background: #111; border-top: 1px solid #333; padding-bottom: env(safe-area-inset-bottom, 0); }
        #bottom-tabs button { flex: 1; min-height: 48px; background: transparent; border: none; color: #666; font-size: 13px; cursor: pointer; padding: 10px 4px; }
        #bottom-tabs button.active { color: #7ab8e8; box-shadow: inset 0 -2px 0 #7ab8e8; }
        #penalty-btns { display: none; gap: 8px; flex-wrap: wrap; justify-content: center; }
        #penalty-btns button { min-height: 44px; min-width: 72px; padding: 10px 20px !important; font-size: 14px !important; }
        @media (max-width: 768px) {
            #topbar { padding: 8px 10px; gap: 8px; }
            #topbar h1.topbar-title { font-size: 14px; margin-right: 0; width: 100%; }
            #roomInput { flex: 1; min-width: 0; width: auto; min-height: 44px; font-size: 16px; }
            #topbar > button { min-height: 44px; padding: 8px 14px; }
            #roomStatus { margin-left: 0; width: 100%; font-size: 12px; order: 10; }
            #topbar-actions { display: none !important; }
            #main { flex-direction: column; height: calc(100vh - 52px - 48px - env(safe-area-inset-bottom, 0px)); height: calc(100dvh - 52px - 48px - env(safe-area-inset-bottom, 0px)); overflow: hidden; }
            #main.view-timer #center { display: flex; flex: 1; min-height: 0; overflow: hidden; padding: 8px 10px 6px; gap: 6px; justify-content: flex-start; }
            #main.view-solves #sidebar { display: flex; flex: 1; width: 100%; min-width: 0; min-height: 0; }
            #main.view-room #rightpanel { display: flex; flex: 1; width: 100%; min-width: 0; min-height: 0; }
            #sidebar, #center, #rightpanel { display: none; }
            #race-banner { font-size: 13px; min-height: 18px; flex-shrink: 0; }
            #scramble-display { font-size: 15px; line-height: 1.5; padding: 0 4px; flex-shrink: 0; max-height: 4.5em; overflow: hidden; }
            #inspection-display { flex-shrink: 0; margin: 0; }
            #inspection-display .insp-num { font-size: 36px; }
            #touch-zone {
                display: flex;
                flex: 1;
                width: 100%;
                min-height: 0;
                margin: 0;
                border: 2px dashed #333;
                border-radius: 12px;
                background: rgba(255,255,255,0.03);
            }
            #touch-zone.arming { border-color: #e05050; }
            #touch-zone.ready { border-color: #50e050; }
            #touch-zone.running { border-style: solid; border-color: #444; }
            #touch-zone.running #touch-zone-label { color: #aaa; font-size: 14px; }
            #timer { font-size: clamp(72px, 28vw, 110px); letter-spacing: -2px; flex-shrink: 0; pointer-events: none; }
            #current-ao5 { flex-shrink: 0; pointer-events: none; }
            #touch-zone-label { font-size: 12px; margin-top: auto; padding-bottom: 8px; }
            #center-meta { flex-shrink: 0; max-height: 28vh; overflow-y: auto; gap: 8px; -webkit-overflow-scrolling: touch; }
            #hint { font-size: 10px; }
            #bottom-tabs { display: flex; }
            #room-actions.in-room { display: flex; }
            #sidebar-header, .solve-row { grid-template-columns: 22px minmax(52px, 1fr) 40px 40px 38px; font-size: 10px; padding: 6px 8px; gap: 2px; }
            #sidebar-header span { font-size: 9px; }
            .stat-label { font-size: 9px; }
            .stat-val { font-size: 11px; }
            #stats-bar { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
            .stat-item { min-width: 52px; flex: 0 0 auto; }
            #race-countdown { font-size: 80px; }
            #roomsPanel { left: 8px; right: 8px; width: auto; max-width: none; }
            #race-controls button { min-height: 44px; min-width: 120px; }
        }
        @media (min-width: 769px) {
            #room-actions { display: none !important; }
            #bottom-tabs { display: none !important; }
            #touch-zone { display: contents !important; }
            #touch-zone-label { display: none !important; }
            #center-meta { display: contents; }
        }
    </style>
</head>
<body>

<div id="topbar">
    <h1 class="topbar-title">Room Timer</h1>
    <input id="roomInput" placeholder="Room Code" />
    <button type="button" onclick="joinRoom()">Join</button>
    <button type="button" id="btn-rooms" onclick="toggleRoomsPanel()">Räume</button>
    <div id="topbar-actions">
        <button type="button" onclick="newScramble()" id="btn-new-scramble">New Scramble</button>
        <button type="button" id="btn-race-mode" onclick="toggleRaceMode()" style="display:none">Race Mode</button>
        <button type="button" class="danger" id="btn-clear" onclick="clearSolves()" style="display:none">Clear</button>
        <button type="button" id="btn-copy-link" onclick="copyRoomLink()" style="display:none">Link kopieren</button>
        <button type="button" id="btn-next-round" class="host-only" onclick="nextRound()" style="display:none">Nächste Runde</button>
        <button type="button" id="btn-end-round" class="host-only danger" onclick="endRound()" style="display:none">Runde beenden</button>
    </div>
    <span id="roomStatus">Kein Room</span>
</div>

<div id="roomsPanel">
    <div id="roomsPanelHeader">
        <b>Offene Räume</b>
        <div style="display:flex; gap:8px;">
            <button onclick="createNewRoom()">Neuer Room</button>
            <button onclick="refreshRoomsList()">Refresh</button>
        </div>
    </div>
    <div id="roomsList" style="max-height: 60vh; overflow:auto; padding-right: 2px;"></div>
</div>

<div id="main" class="view-timer">

    <div id="sidebar">
        <div id="stats-bar">
            <div class="stat-item"><span class="stat-label">AO5</span><span class="stat-val" id="stat-ao5">–</span></div>
            <div class="stat-item"><span class="stat-label">AO12</span><span class="stat-val" id="stat-ao12">–</span></div>
            <div class="stat-item"><span class="stat-label">AO50</span><span class="stat-val" id="stat-ao50">–</span></div>
            <div class="stat-item"><span class="stat-label">Best</span><span class="stat-val highlight" id="stat-best">–</span></div>
            <div class="stat-item"><span class="stat-label">Mean</span><span class="stat-val" id="stat-mean">–</span></div>
        </div>
        <div id="sidebar-header">
            <span>#</span><span style="text-align:left">Zeit</span><span>AO5</span><span>AO12</span><span>Best</span>
        </div>
        <div id="solve-list">
            <div style="color:#333;font-size:12px;text-align:center;padding:32px 16px;">Noch keine Solves</div>
        </div>
    </div>

    <div id="center">
        <div id="race-banner"></div>
        <div id="scramble-display">–</div>
        <div id="inspection-display">
            <div class="insp-num" id="inspection-seconds-inline">15</div>
            <div class="insp-label" id="inspection-label-inline">Inspektion</div>
        </div>
        <div id="touch-zone" aria-label="Timer">
            <div id="timer">0.00</div>
            <div id="current-ao5"></div>
            <span id="touch-zone-label">Gedrückt halten, dann loslassen</span>
        </div>
        <div id="center-meta">
            <div id="inspection-hint"></div>
            <div id="race-status"></div>
            <div id="race-controls" style="display:none"></div>
            <div id="race-results"></div>
            <div id="penalty-btns">
                <button type="button" onclick="applyPenalty('+2')" style="background:#2a2a2a;border:1px solid #f0c060;color:#f0c060;border-radius:4px;cursor:pointer;">+2</button>
                <button type="button" onclick="applyPenalty('DNF')" style="background:#2a2a2a;border:1px solid #e06060;color:#e06060;border-radius:4px;cursor:pointer;">DNF</button>
            </div>
            <div id="hint">Leertaste halten → loslassen zum Starten</div>
        </div>
    </div>

    <div id="rightpanel">
        <div id="room-actions"></div>
        <div id="rightpanel-header">Room Users · <span style="color:#8f8">Race</span> / <span style="color:#666">Solo</span></div>
        <div id="users">
            <div style="color:#333;font-size:12px;text-align:center;padding:24px;">Noch kein Room</div>
        </div>
    </div>

</div>

<nav id="bottom-tabs" aria-label="Ansicht">
    <button type="button" data-tab="timer" class="active">Timer</button>
    <button type="button" data-tab="solves">Solves</button>
    <button type="button" data-tab="room">Room</button>
</nav>

<div id="race-countdown">
    <span id="inspection-seconds">15</span>
    <span class="inspection-sub">Inspektion</span>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
socket.on("connect", () => {
    myId = socket.id;
    if (raceStateCache) applyRaceState(raceStateCache);
});
let myId = null;
let mySolves = [];
let myName   = "";
let currentRoom = "";
let running  = false;
let armed    = false;
let startTime = 0;
let interval  = null;
let holdTimer = null;
let pendingLocalSolvesRaw = null;
let lastRoomsList = [];
let myRaceEnabled = false;
let raceHostId = null;
let raceRound = {
    phase: "idle",
    scramble: null,
    inspectionStartAt: null,
    inspectionPenaltyAt: null,
    inspectionDnfAt: null,
    ready: {},
    finishes: {},
    rankings: null,
};
let inspectionInterval = null;
let iAmReady = false;
let lastRaceFinisherMsg = "";

function generateWCAScramble() {
    const axes = { X:["R","L"], Y:["U","D"], Z:["F","B"] };
    const sfx  = ["","'","2"];
    const keys = Object.keys(axes);
    let out = [], last = null;
    for (let i = 0; i < 20; i++) {
        let ax;
        do { ax = keys[Math.floor(Math.random()*keys.length)]; } while (ax===last);
        last = ax;
        out.push(axes[ax][Math.floor(Math.random()*2)] + sfx[Math.floor(Math.random()*3)]);
    }
    return out.join(" ");
}

let myScramble = generateWCAScramble();
document.getElementById("scramble-display").textContent = myScramble;

function newScramble() {
    if (myRaceEnabled && raceRound.scramble) return;
    myScramble = generateWCAScramble();
    document.getElementById("scramble-display").textContent = myScramble;
    socket.emit("scrambleUpdate", { scramble: myScramble });
}

function isRaceRoundActive() {
    const p = raceRound.phase;
    return p === "ready" || p === "solving";
}

function canToggleRaceModeNow() {
    return raceRound.phase === "idle" || raceRound.phase === "results";
}

function raceParticipantCount() {
    if (!raceStateCache || !raceStateCache.raceEnabled) return 0;
    return Object.values(raceStateCache.raceEnabled).filter(Boolean).length;
}

let raceStateCache = null;
const usersCache = {};

function isUserInRace(id) {
    return !!(raceStateCache && raceStateCache.raceEnabled && raceStateCache.raceEnabled[id]);
}

function raceBadgeHtml(id) {
    if (!currentRoom) return "";
    const on = isUserInRace(id);
    return `<span class="race-badge ${on ? "race-on" : "race-off"}">${on ? "Race" : "Solo"}</span>`;
}

function refreshAllUsersFromCache() {
    for (const id in usersCache) {
        const u = usersCache[id];
        renderUser(id, u.name, u.scramble, u.solves, u.ao5, true);
    }
}

function applyRaceState(state) {
    raceStateCache = state;
    if (!state) return;
    raceHostId = state.hostId;
    myRaceEnabled = !!(state.raceEnabled && state.raceEnabled[myId]);
    raceRound = state.round ? { ...state.round } : raceRound;
    normalizeRaceRoundTimestamps();
    iAmReady = !!(raceRound.ready && raceRound.ready[myId]);

    if (myRaceEnabled && raceRound.scramble) {
        myScramble = raceRound.scramble;
        document.getElementById("scramble-display").textContent = myScramble;
    }

    updateRaceUI();
    updateInspectionUI();
    refreshAllUsersFromCache();
}

function updateRaceUI() {
    const btnRace = document.getElementById("btn-race-mode");
    const btnNext = document.getElementById("btn-next-round");
    const btnEnd = document.getElementById("btn-end-round");
    const btnScramble = document.getElementById("btn-new-scramble");
    const controls = document.getElementById("race-controls");
    const statusEl = document.getElementById("race-status");
    const resultsEl = document.getElementById("race-results");
    const hint = document.getElementById("hint");
    const isHost = myId && raceHostId === myId;
    const phase = raceRound.phase;

    if (currentRoom) {
        setToolbarBtnVisible(btnRace, true);
        btnRace.classList.toggle("active", myRaceEnabled);
        btnRace.textContent = myRaceEnabled ? "Race Mode: AN" : "Race Mode";
        btnRace.disabled = !canToggleRaceModeNow();
    } else {
        setToolbarBtnVisible(btnRace, false);
    }

    setToolbarBtnVisible(btnNext, isHost && currentRoom && (phase === "idle" || phase === "results"));
    setToolbarBtnVisible(
        btnEnd,
        isHost && currentRoom && (phase === "ready" || phase === "solving")
    );

    if (myRaceEnabled && isRaceRoundActive()) {
        setToolbarBtnVisible(btnScramble, false);
    } else {
        setToolbarBtnVisible(btnScramble, !!currentRoom);
    }

    const btnClear = document.getElementById("btn-clear");
    const btnCopy = document.getElementById("btn-copy-link");
    setToolbarBtnVisible(btnClear, !!currentRoom);
    setToolbarBtnVisible(btnCopy, !!currentRoom);

    if (!myRaceEnabled || phase === "idle") {
        controls.style.display = "none";
        statusEl.textContent = myRaceEnabled && phase === "idle" ? "Warte auf „Nächste Runde“ (Host)" : "";
        resultsEl.style.display = "none";
        if (!isRaceRoundActive()) hint.style.display = "";
        const inspHint = document.getElementById("inspection-hint");
        if (inspHint) inspHint.textContent = "";
        updateTouchZoneUI();
        updateInspectionUI();
        return;
    }

    controls.style.display = "flex";
    resultsEl.style.display = phase === "results" ? "block" : "none";

    if (phase === "ready") {
        const readyCount = Object.keys(raceRound.ready || {}).filter((id) => raceStateCache.raceEnabled[id] && raceRound.ready[id]).length;
        const total = raceParticipantCount();
        statusEl.textContent = `${readyCount}/${total} Race-Teilnehmer ready`;
        controls.innerHTML = `<button id="btn-race-ready" class="${iAmReady ? "ready-on" : ""}" onclick="toggleRaceReady()">${iAmReady ? "Ready ✓" : "Ready"}</button>`;
        hint.textContent = "Drücke Ready wenn du bereit bist";
        hint.style.display = "";
    } else if (phase === "solving") {
        const ids = Object.keys(raceStateCache.raceEnabled || {}).filter((id) => raceStateCache.raceEnabled[id]);
        const done = ids.filter((id) => raceRound.finishes[id] && raceRound.finishes[id].done).length;
        controls.innerHTML = "";
        if (!isInspectionWindowActive()) {
            statusEl.textContent = `Runde läuft · ${done}/${ids.length} fertig`;
            statusEl.className = "";
        }
        hint.textContent = isMobileLayout()
            ? "Halten & loslassen zum Starten"
            : "Leertaste halten → loslassen zum Starten";
        hint.style.display = "";
    } else if (phase === "results") {
        statusEl.textContent = "Ergebnis";
        controls.innerHTML = "";
        hint.style.display = "none";
        const inspHint = document.getElementById("inspection-hint");
        if (inspHint) inspHint.textContent = "";
        renderRaceResults(raceRound.rankings);
    }
    updateTouchZoneUI();
    updateInspectionUI();
}

function normalizeRaceRoundTimestamps() {
    for (const k of ["inspectionStartAt", "inspectionPenaltyAt", "inspectionDnfAt"]) {
        if (raceRound[k] != null && raceRound[k] !== "") {
            raceRound[k] = Number(raceRound[k]);
        }
    }
}

function hasPersonalRaceStarted() {
    if (!myId || !myRaceEnabled) return false;
    const fin = raceRound.finishes && raceRound.finishes[myId];
    return !!(fin && fin.started);
}

function isInspectionWindowActive() {
    if (hasPersonalRaceStarted()) return false;
    return (
        currentRoom &&
        myRaceEnabled &&
        raceRound.phase === "solving" &&
        raceRound.inspectionPenaltyAt &&
        raceRound.inspectionDnfAt &&
        Date.now() < raceRound.inspectionDnfAt
    );
}

function markPersonalRaceStarted() {
    if (!myId || !myRaceEnabled) return;
    if (!raceRound.finishes) raceRound.finishes = {};
    if (!raceRound.finishes[myId]) {
        raceRound.finishes[myId] = { done: false, started: true, startPenalty: 0 };
    } else {
        raceRound.finishes[myId].started = true;
    }
}

function getInspectionPhase() {
    if (!isInspectionWindowActive()) return null;
    const now = Date.now();
    if (now < raceRound.inspectionPenaltyAt) {
        return {
            kind: "inspection",
            sec: Math.ceil((raceRound.inspectionPenaltyAt - now) / 1000),
            label: "Inspektion",
            hint: "Du kannst jetzt starten",
        };
    }
    if (now < raceRound.inspectionDnfAt) {
        return {
            kind: "penalty",
            sec: Math.ceil((raceRound.inspectionDnfAt - now) / 1000),
            label: "+2 bei Start",
            hint: "DNF wenn du nicht startest",
        };
    }
    return null;
}

function getInspectionStatusText() {
    const p = getInspectionPhase();
    if (!p) return "";
    if (p.kind === "inspection") return `Inspektion: ${p.sec}s – ${p.hint}`;
    return `+2 bei Start · DNF in ${p.sec}s`;
}

function stopInspectionTick() {
    if (inspectionInterval) {
        clearInterval(inspectionInterval);
        inspectionInterval = null;
    }
}

function ensureInspectionTick() {
    if (!inspectionInterval) {
        inspectionInterval = setInterval(updateInspectionUI, 100);
    }
}

function hideInspectionUI() {
    stopInspectionTick();
    const overlay = document.getElementById("race-countdown");
    const inline = document.getElementById("inspection-display");
    const inspHint = document.getElementById("inspection-hint");
    const statusEl = document.getElementById("race-status");
    if (overlay) overlay.style.display = "none";
    if (inline) inline.style.display = "none";
    if (inspHint) inspHint.textContent = "";
    if (statusEl) statusEl.classList.remove("inspection-active", "penalty-active");
    if (raceRound.phase === "solving" && myRaceEnabled && raceStateCache) {
        const ids = Object.keys(raceStateCache.raceEnabled || {}).filter((id) => raceStateCache.raceEnabled[id]);
        const done = ids.filter((id) => raceRound.finishes[id] && raceRound.finishes[id].done).length;
        if (statusEl) statusEl.textContent = `Runde läuft · ${done}/${ids.length} fertig`;
    }
}

function updateInspectionUI() {
    const overlay = document.getElementById("race-countdown");
    const inline = document.getElementById("inspection-display");
    const inspHint = document.getElementById("inspection-hint");
    const statusEl = document.getElementById("race-status");
    const secEl = document.getElementById("inspection-seconds");
    const secInline = document.getElementById("inspection-seconds-inline");
    const labelInline = document.getElementById("inspection-label-inline");
    const subEl = overlay && overlay.querySelector(".inspection-sub");

    if (hasPersonalRaceStarted()) {
        hideInspectionUI();
        if (statusEl && raceRound.phase === "solving") {
            statusEl.textContent = running ? "Solve läuft…" : "Solve gestartet";
            statusEl.className = "";
        }
        return;
    }

    const phase = getInspectionPhase();
    if (!phase) {
        hideInspectionUI();
        return;
    }

    ensureInspectionTick();

    const text = getInspectionStatusText();
    const banner = document.getElementById("race-banner");
    if (inspHint) inspHint.textContent = text;
    if (banner) banner.textContent = text;
    if (statusEl) {
        statusEl.textContent = text;
        statusEl.classList.toggle("inspection-active", phase.kind === "inspection");
        statusEl.classList.toggle("penalty-active", phase.kind === "penalty");
    }

    const secStr = String(phase.sec);
    if (secEl) secEl.textContent = secStr;
    if (secInline) secInline.textContent = secStr;
    if (labelInline) labelInline.textContent = phase.label;
    if (subEl) subEl.textContent = phase.label;

    if (inline) {
        inline.style.display = "block";
        inline.classList.toggle("penalty-phase", phase.kind === "penalty");
    }

    if (overlay) {
        overlay.style.display = "flex";
        overlay.style.color = phase.kind === "inspection" ? "#7ab8e8" : "#f0c060";
    }
}

function renderRaceResults(rankings) {
    const el = document.getElementById("race-results");
    if (!Array.isArray(rankings) || !rankings.length) {
        el.innerHTML = "";
        return;
    }
    const rows = rankings
        .map(
            (r) =>
                `<div class="race-place"><span class="place">#${r.place}</span><span class="pname">${escapeHtml(r.name)}</span><span class="ptime">${fmt(r.time)}</span></div>`
        )
        .join("");
    el.innerHTML = `<h3>Runde – Ergebnis</h3>${rows}`;
}

function escapeHtml(s) {
    return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}

function toggleRaceMode() {
    if (!currentRoom || !canToggleRaceModeNow()) return;
    socket.emit("toggleRaceMode", { enabled: !myRaceEnabled });
}

function toggleRaceReady() {
    if (!myRaceEnabled || raceRound.phase !== "ready") return;
    if (iAmReady) {
        socket.emit("raceUnready");
        iAmReady = false;
    } else {
        socket.emit("raceReady");
        iAmReady = true;
    }
    updateRaceUI();
}

function nextRound() {
    if (!confirm("Neue Runde starten?")) return;
    socket.emit("nextRound");
    document.getElementById("race-banner").textContent = "";
    document.getElementById("penalty-btns").style.display = "none";
    iAmReady = false;
}

function endRound() {
    if (!confirm("Runde für alle beenden? Nicht Fertige werden als DNF gewertet.")) return;
    socket.emit("endRound");
}

function canArmTimer() {
    // Solo / kein Room / nicht im Race Mode: normal timen
    if (!currentRoom || !myRaceEnabled) return true;
    // Zwischen Runden im Race Mode: solo timen erlaubt
    if (raceRound.phase === "idle" || raceRound.phase === "results") return true;
    // Warten auf Ready: erst nach Inspektion starten
    if (raceRound.phase === "ready") return false;
    if (raceRound.phase !== "solving") return true;

    const fin = myId && raceRound.finishes ? raceRound.finishes[myId] : null;
    if (fin && fin.done) return false;
    if (running) return true;
    if (fin && fin.started) return true;
    // Inspektion / +2-Fenster: starten bis DNF-Frist (Fallback wenn Timestamps fehlen)
    if (!raceRound.inspectionDnfAt) return true;
    return Date.now() < raceRound.inspectionDnfAt;
}

function showRaceFinisher(data) {
    const t = data.time === null ? "DNF" : fmt(data.time);
    const msg = `${data.name} ist fertig – ${t}`;
    document.getElementById("race-banner").textContent = msg;
    lastRaceFinisherMsg = msg;
}

const STORAGE_NAME_KEY = "livetimer_display_name";
const STORAGE_SOLVES_PREFIX = "livetimer_room_solves__";

function roomSolvesKey(room) {
    return STORAGE_SOLVES_PREFIX + String(room || "");
}

function loadRoomSolvesRaw(room) {
    try {
        const raw = localStorage.getItem(roomSolvesKey(room));
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : null;
    } catch (e) {
        return null;
    }
}

function saveRoomSolvesRaw(room, solvesRaw) {
    if (!room) return;
    try {
        localStorage.setItem(roomSolvesKey(room), JSON.stringify(solvesRaw || []));
    } catch (e) {}
}

function getRoomFromQuery() {
    const q = new URLSearchParams(location.search);
    let r = (q.get("room") || q.get("r") || "").trim();
    if (!r) return "";
    try {
        return decodeURIComponent(r).trim();
    } catch {
        return r;
    }
}

function setRoomInAddressBar(room) {
    const params = new URLSearchParams(location.search);
    params.set("room", room);
    params.delete("r");
    const qs = params.toString();
    const url = qs ? `${location.pathname}?${qs}${location.hash}` : `${location.pathname}${location.hash}`;
    history.replaceState(null, "", url);
}

function doJoinRoom(room, name) {
    const n = (name || "").trim();
    if (!room || !n) return;
    currentRoom = room;
    myName = n;
    try {
        localStorage.setItem(STORAGE_NAME_KEY, n);
    } catch (e) {}
    document.getElementById("roomInput").value = room;
    setRoomInAddressBar(room);

    // Load local solves immediately (so UI isn't empty on fresh server restart),
    // then sync them to server after join.
    pendingLocalSolvesRaw = loadRoomSolvesRaw(room);
    if (pendingLocalSolvesRaw && pendingLocalSolvesRaw.length) {
        mySolves = normalizeSolveArray(pendingLocalSolvesRaw);
        renderSolveList();
        updateStatsBar();
    }

    socket.emit("joinRoom", { roomId: room, name: n });
    document.getElementById("roomStatus").textContent = room + " | " + n;
    document.getElementById("users").innerHTML = "";
    for (const k in usersCache) delete usersCache[k];
    relocateToolbarButtons();
    updateRaceUI();
    updateTouchZoneUI();
    updateInspectionUI();
}

function joinFromRoomCode(room) {
    const r = String(room || "").trim();
    if (!r) return;
    document.getElementById("roomInput").value = r;
    let stored = "";
    try {
        stored = localStorage.getItem(STORAGE_NAME_KEY) || "";
    } catch (e) {}
    if (stored && stored.trim()) {
        doJoinRoom(r, stored.trim());
        return;
    }
    const name = prompt("Dein Name:", "");
    if (name && name.trim()) doJoinRoom(r, name.trim());
}

function generateRoomCode(len = 6) {
    const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no I,O,0,1
    let out = "";
    for (let i = 0; i < len; i++) {
        out += alphabet[Math.floor(Math.random() * alphabet.length)];
    }
    return out;
}

function createNewRoom() {

function clearSolves() {
    if (!confirm("Alle Solves löschen?")) return;
    socket.emit("clearSolves");
}

function calcAoN(arr, n) {
    if (arr.length < n) return null;
    // Same WCA-style trimming as server: tie-break equals by attempt order within the window.
    const seg = arr.slice(-n);
    const indexed = seg.map((t, i) => ({ t, i }));
    indexed.sort((a, b) => (a.t !== b.t ? a.t - b.t : a.i - b.i));
    const middle = indexed.slice(1, -1).map((x) => x.t);
    if (middle.some((v) => !Number.isFinite(v))) return Infinity;
    return middle.reduce((a, b) => a + b, 0) / middle.length;
}

/** Local indices (0..4) dropped for Ao5 — WCA tie-break on equal times. */
function ao5DroppedLocalIndices(window5) {
    if (!Array.isArray(window5) || window5.length !== 5) return new Set();
    const indexed = window5.map((t, i) => ({ t, i }));
    indexed.sort((a, b) => (a.t !== b.t ? a.t - b.t : a.i - b.i));
    return new Set([indexed[0].i, indexed[4].i]);
}

/** Klammern nur bei den aktuellen letzten 5 Solves — genau die zwei Streichzeiten für Ao5. */
function isDroppedInLastAo5(i, solves) {
    if (!Array.isArray(solves) || solves.length < 5) return false;
    const base = solves.length - 5;
    if (i < base) return false;
    return ao5DroppedLocalIndices(solves.slice(-5)).has(i - base);
}

function fmt(v) {
    if (v === null || v === undefined) return "–";
    if (v === Infinity) return "DNF";
    const n = Number(v);
    if (!Number.isFinite(n)) return "–";
    return n.toFixed(2);
}

/** Socket.IO uses JSON — Infinity serializes as null. Map null → DNF. */
function normalizeSolveArray(raw) {
    if (!Array.isArray(raw)) return [];
    return raw.map((v) => (Object.is(v, null) ? Infinity : Number(v)));
}

function renderSolveList() {
    const el = document.getElementById("solve-list");
    if (!mySolves.length) {
        el.innerHTML = '<div style="color:#333;font-size:12px;text-align:center;padding:32px 16px;">Noch keine Solves</div>';
        return;
    }

    // Precompute all ao5/ao12 running values for best-of highlighting
    const allAo5  = mySolves.map((_,i) => i>=4  ? calcAoN(mySolves.slice(0,i+1),5)  : null);
    const allAo12 = mySolves.map((_,i) => i>=11 ? calcAoN(mySolves.slice(0,i+1),12) : null);
    const validAo5  = allAo5.filter(v=>v!==null);
    const validAo12 = allAo12.filter(v=>v!==null);
    const bestAo5   = validAo5.length  ? Math.min(...validAo5.filter(Number.isFinite))  : null;
    const bestAo12  = validAo12.length ? Math.min(...validAo12.filter(Number.isFinite)) : null;
    const finiteSolves = mySolves.filter(Number.isFinite);
    const globalBest = finiteSolves.length ? Math.min(...finiteSolves) : null;

    let html = "";
    for (let i = mySolves.length-1; i >= 0; i--) {
    const t    = mySolves[i];
    const ao5  = allAo5[i];
    const ao12 = allAo12[i];
    const prefixFinite = mySolves.slice(0,i+1).filter(Number.isFinite);
    const best = prefixFinite.length ? Math.min(...prefixFinite) : null;
    const isPB = globalBest !== null && Number.isFinite(t) && t === globalBest;
    const isLatest = i === mySolves.length-1;

    // Ao5-Klammern nur für die letzten 5 Solves — verschiebt sich nach jedem neuen Solve.
    let timeStr = fmt(t);
    if (isDroppedInLastAo5(i, mySolves)) timeStr = `(${timeStr})`;
    else if (i < 4 && t === Infinity) timeStr = "DNF";

    const ao5Cls = ao5 !== null && bestAo5 !== null && ao5 === bestAo5 ? " best-avg" : "";
    const ao12Cls = ao12 !== null && bestAo12 !== null && ao12 === bestAo12 ? " best-avg" : "";

    html += `<div class="solve-row${isLatest ? " latest" : ""}" data-solve-index="${i}">
        <span class="num">${i + 1}</span>
        <span class="time${isPB ? " pb" : ""}">${timeStr}</span>
        <span class="avg${ao5Cls}">${fmt(ao5)}</span>
        <span class="avg${ao12Cls}">${fmt(ao12)}</span>
        <span class="bestcell">${best !== null ? fmt(best) : "–"}</span>
    </div>`;
}
    el.innerHTML = html;
    el.scrollTop = 0;
}

function updateStatsBar() {
    const ao5  = calcAoN(mySolves,5);
    const ao12 = calcAoN(mySolves,12);
    const ao50 = calcAoN(mySolves,50);
    const finite = mySolves.filter(Number.isFinite);
    const best = finite.length ? Math.min(...finite) : null;
    const mean = finite.length ? finite.reduce((a,b)=>a+b,0)/finite.length : null;
    document.getElementById("stat-ao5").textContent  = fmt(ao5);
    document.getElementById("stat-ao12").textContent = fmt(ao12);
    document.getElementById("stat-ao50").textContent = fmt(ao50);
    document.getElementById("stat-best").textContent = fmt(best);
    document.getElementById("stat-mean").textContent = fmt(mean);

    const ao5El = document.getElementById("current-ao5");
    if (!ao5El) return;
    if (!running && mySolves.length >= 5) {
        ao5El.innerHTML = `AO5: <b>${fmt(ao5)}</b>`;
    } else {
        ao5El.textContent = "";
    }
}

socket.on("timeUpdate", (data) => {

socket.on("scrambleUpdate", (data) => {

socket.on("solveUpdate", (data) => {
    const solves = normalizeSolveArray(data.solves);

    if (data.id === myId) {
        mySolves = solves;
        renderSolveList();
        updateStatsBar();
        if (currentRoom) saveRoomSolvesRaw(currentRoom, Array.isArray(data.solves) ? data.solves : []);
    }

    renderUser(data.id, data.name, "", solves, data.ao5);
});

socket.on("raceState", (state) => {
    applyRaceState(state);
});

socket.on("raceFinisher", (data) => {
    showRaceFinisher(data);
});

socket.on("raceInspectionPenalty", (data) => {
    if (data) {
        if (data.inspectionPenaltyAt != null) raceRound.inspectionPenaltyAt = Number(data.inspectionPenaltyAt);
        if (data.inspectionDnfAt != null) raceRound.inspectionDnfAt = Number(data.inspectionDnfAt);
    }
    if (!hasPersonalRaceStarted()) {
        const banner = document.getElementById("race-banner");
        if (banner) banner.textContent = "+2 wenn du jetzt startest";
    }
    updateInspectionUI();
});

socket.on("raceInspectionEnded", () => {
    updateInspectionUI();
    updateRaceUI();
});

socket.on("roundResults", (data) => {
    if (data && data.rankings) {
        raceRound.rankings = data.rankings;
        renderRaceResults(data.rankings);
        document.getElementById("race-results").style.display = myRaceEnabled ? "block" : "none";
    }
});

socket.on("initState", (data) => {
    if (data.race) applyRaceState(data.race);
    for (const id in data.names) {
        const solves = normalizeSolveArray(data.solves[id]);

        if (id === myId) {
            // If server has none (memory reset) but we loaded some from localStorage,
            // keep local and sync it back to server once.
            if (Array.isArray(data.solves[id]) && data.solves[id].length === 0 && pendingLocalSolvesRaw && pendingLocalSolvesRaw.length) {
                mySolves = normalizeSolveArray(pendingLocalSolvesRaw);
                renderSolveList();
                updateStatsBar();
                socket.emit("syncSolves", { solves: pendingLocalSolvesRaw });
            } else {
                mySolves = solves;
                renderSolveList();
                updateStatsBar();
                if (currentRoom) saveRoomSolvesRaw(currentRoom, Array.isArray(data.solves[id]) ? data.solves[id] : []);
            }
            pendingLocalSolvesRaw = null;
        }

        renderUser(
            id,
            data.names[id],
            data.scrambles[id] || "",
            solves,
            calcAoN(solves, 5)
        );
    }
});

socket.on("removeUser", (id) => {
    const el = document.getElementById("u_"+id);
    if (el) el.remove();
    delete usersCache[id];
});

socket.on("roomsList", (data) => {
    renderRoomsList(data && data.rooms);
});

socket.on("roomsChanged", (data) => {
    const panel = document.getElementById("roomsPanel");
    if (panel && panel.style.display !== "none") {
        renderRoomsList(data && data.rooms);
    }
});

function renderUser(id, name, scramble, solves, ao5, fromCacheRefresh) {
    let el = document.getElementById("u_"+id);
    if (!el) {
        el = document.createElement("div");
        el.className = "box";
        el.id = "u_"+id;
        const container = document.getElementById("users");
        if (container.querySelector('[style*="Noch"]')) container.innerHTML = "";
        container.appendChild(el);
    }
    const scr = scramble || el.dataset.scramble || "";
    el.dataset.scramble = scr;

    const arr   = Array.isArray(solves) ? normalizeSolveArray(solves) : [];
    const ao5v  = calcAoN(arr,5);
    const ao12v = calcAoN(arr,12);
    const finiteArr = arr.filter(Number.isFinite);
    const bestv = finiteArr.length ? Math.min(...finiteArr) : null;

    const recent = [...arr].reverse().slice(0, 8);
    const rows = recent.length
        ? recent.map((t,i) => `<div class="box-solve-row"><span class="box-num">#${arr.length-i}</span><span>${fmt(t)}</span></div>`).join("")
        : '<div style="color:#383838;font-size:11px;padding:2px 0;">Keine Solves</div>';

    const prevLive = el.querySelector(".live-time");
    const liveText =
        fromCacheRefresh && prevLive && raceRound.phase === "solving" && isUserInRace(id) && !raceRound.finishes?.[id]?.done
            ? prevLive.textContent
            : arr.length
              ? fmt(arr[arr.length - 1])
              : "–";

    const safeName = escapeHtml(name || "?");
    usersCache[id] = { name: name || "?", scramble: scr, solves: arr, ao5 };

    el.innerHTML = `
    <div class="box-title-row">
        <b>${safeName}</b>
        ${raceBadgeHtml(id)}
    </div>
    <div class="live-time" style="font-size:28px;font-family:'Courier New',monospace;color:#50e050;text-align:center;padding:4px 0;min-height:38px;">${liveText}</div>
        <div class="scramble-text">${escapeHtml(scr || "–")}</div>
        <div class="box-stats">
            <span>AO5 <b>${fmt(ao5v)}</b></span>
            <span>AO12 <b>${fmt(ao12v)}</b></span>
            <span>Best <b style="color:#60c0f0">${fmt(bestv)}</b></span>
        </div>
        <div class="box-solves">${rows}</div>`;
}

const MOBILE_MQ = window.matchMedia("(max-width: 768px)");
const TOOLBAR_BTN_IDS = ["btn-new-scramble", "btn-race-mode", "btn-clear", "btn-copy-link", "btn-next-round", "btn-end-round"];

function isMobileLayout() {
    return MOBILE_MQ.matches;
}

function setToolbarBtnVisible(el, visible) {
    if (!el) return;
    if (!visible) {
        el.style.display = "none";
        return;
    }
    el.style.display = isMobileLayout() ? "block" : "inline-block";
}

function relocateToolbarButtons() {
    const topbarSlot = document.getElementById("topbar-actions");
    const roomSlot = document.getElementById("room-actions");
    if (!topbarSlot || !roomSlot) return;
    const target = isMobileLayout() ? roomSlot : topbarSlot;
    for (const id of TOOLBAR_BTN_IDS) {
        const btn = document.getElementById(id);
        if (btn && btn.parentElement !== target) target.appendChild(btn);
    }
    roomSlot.classList.toggle("in-room", isMobileLayout() && !!currentRoom);
}

function setMobileTab(tab) {
    const main = document.getElementById("main");
    if (!main) return;
    main.classList.remove("view-timer", "view-solves", "view-room");
    main.classList.add("view-" + tab);
    document.querySelectorAll("#bottom-tabs button").forEach((b) => {
        b.classList.toggle("active", b.dataset.tab === tab);
    });
}

function updateTouchZoneUI() {
    const zone = document.getElementById("touch-zone");
    const label = document.getElementById("touch-zone-label");
    const hint = document.getElementById("hint");
    const timer = document.getElementById("timer");
    if (!zone || !label) return;

    zone.classList.remove("arming", "ready", "running");
    if (timer) {
        if (timer.classList.contains("arming")) zone.classList.add("arming");
        if (timer.classList.contains("ready")) zone.classList.add("ready");
    }
    if (running) zone.classList.add("running");

    if (!isMobileLayout()) return;

    let text = "Gedrückt halten, dann loslassen";
    if (running) text = "Tippen zum Stoppen";
    else if (timer && timer.classList.contains("ready")) text = "Loslassen zum Start";
    else if (timer && timer.classList.contains("arming")) text = "Halten…";
    label.textContent = text;

    if (hint && !isRaceRoundActive()) {
        if (running) hint.textContent = "Tippen zum Stoppen";
        else if (timer && timer.classList.contains("ready")) hint.textContent = "Loslassen zum Start";
        else hint.textContent = "Halten & loslassen zum Starten";
    }
}

function timerArmStart() {
    if (!canArmTimer()) return;
    if (running) {
        stop();
        return;
    }
    document.getElementById("timer").classList.add("arming");
    holdTimer = setTimeout(() => {
        armed = true;
        document.getElementById("timer").classList.remove("arming");
        document.getElementById("timer").classList.add("ready");
        updateTouchZoneUI();
    }, 500);
    updateTouchZoneUI();
}

function timerArmEnd() {
    clearTimeout(holdTimer);
    document.getElementById("timer").classList.remove("arming");
    if (armed && !running && canArmTimer()) start();
    armed = false;
    updateTouchZoneUI();
}

function start() {
    document.getElementById("penalty-btns").style.display = "none";
    if (running) return;
    if (myRaceEnabled && raceRound.phase === "solving" && myId) {
        const fin = raceRound.finishes && raceRound.finishes[myId];
        if (!fin || !fin.started) {
            markPersonalRaceStarted();
            socket.emit("raceSolveStart");
            hideInspectionUI();
        }
    }
    running   = true;
    startTime = Date.now();
    document.getElementById("timer").classList.remove("ready","arming");
    updateTouchZoneUI();
    updateInspectionUI();
    interval = setInterval(() => {
        document.getElementById("timer").textContent = ((Date.now()-startTime)/1000).toFixed(2);
        socket.emit("timeUpdate", ((Date.now()-startTime)/1000).toFixed(2));
    }, 50);
}

function stop() {
    if (!running) return;
    running = false;
    clearInterval(interval); interval = null;
    clearTimeout(holdTimer);
    document.getElementById("timer").classList.remove("ready","arming");
    const final = ((Date.now()-startTime)/1000).toFixed(2);
    document.getElementById("timer").textContent = final;
    const inRaceSolve = myRaceEnabled && raceRound.phase === "solving";
    socket.emit("solveEnd", final);
    document.getElementById("penalty-btns").style.display = "flex";
    updateTouchZoneUI();
    if (!inRaceSolve) newScramble();
}

function applyPenalty(type) {
    if (!mySolves.length) return;

    document.getElementById("penalty-btns").style.display = "none";

    socket.emit("updateLastSolve", { type });
}
function deleteSolve(i) {
    if (!confirm(`Solve #${i+1} löschen?`)) return;
    socket.emit("deleteSolve", { index: i });
}

document.getElementById("solve-list").addEventListener("contextmenu", (e) => {
    const row = e.target.closest(".solve-row");
    if (!row || !e.currentTarget.contains(row)) return;
    e.preventDefault();
    const idx = parseInt(row.dataset.solveIndex, 10);
    if (!Number.isInteger(idx) || idx < 0) return;
    deleteSolve(idx);
});

let solveLongPressTimer = null;
const solveListEl = document.getElementById("solve-list");
solveListEl.addEventListener("touchstart", (e) => {
    const row = e.target.closest(".solve-row");
    if (!row || !solveListEl.contains(row)) return;
    const idx = parseInt(row.dataset.solveIndex, 10);
    if (!Number.isInteger(idx) || idx < 0) return;
    solveLongPressTimer = setTimeout(() => {
        solveLongPressTimer = null;
        if (navigator.vibrate) navigator.vibrate(30);
        deleteSolve(idx);
    }, 550);
}, { passive: true });
solveListEl.addEventListener("touchend", () => {
    if (solveLongPressTimer) clearTimeout(solveLongPressTimer);
    solveLongPressTimer = null;
});
solveListEl.addEventListener("touchmove", () => {
    if (solveLongPressTimer) clearTimeout(solveLongPressTimer);
    solveLongPressTimer = null;
});
solveListEl.addEventListener("touchcancel", () => {
    if (solveLongPressTimer) clearTimeout(solveLongPressTimer);
    solveLongPressTimer = null;
});

const touchZone = document.getElementById("touch-zone");
touchZone.addEventListener("touchstart", (e) => {
    e.preventDefault();
    timerArmStart();
}, { passive: false });
touchZone.addEventListener("touchend", (e) => {
    e.preventDefault();
    timerArmEnd();
}, { passive: false });
touchZone.addEventListener("touchcancel", () => timerArmEnd());

document.querySelectorAll("#bottom-tabs button").forEach((btn) => {
    btn.addEventListener("click", () => setMobileTab(btn.dataset.tab));
});
MOBILE_MQ.addEventListener("change", () => {
    relocateToolbarButtons();
    updateRaceUI();
    updateTouchZoneUI();
    updateInspectionUI();
});
relocateToolbarButtons();
updateTouchZoneUI();
updateInspectionUI();

document.addEventListener("keydown", (e) => {
    if (e.code !== "Space" || e.repeat) return;
    if (!canArmTimer()) return;
    e.preventDefault();
    timerArmStart();
});

document.addEventListener("keyup", (e) => {
    if (e.code !== "Space") return;
    if (!canArmTimer() && !running) return;
    e.preventDefault();
    timerArmEnd();
});

window.addEventListener("blur", () => { if (running) stop(); });
</script>
</body>
</html>
