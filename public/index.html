<!DOCTYPE html>
<html>
<head>
    <title>Room Timer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        input, button {
            margin: 4px;
        }

        /* ---------------- MAIN TIMER ---------------- */
        #timer {
            font-size: 70px;
            font-weight: bold;
            transition: color 0.15s;
        }

        .arming {
            color: rgb(255, 0, 0);
        }

        .ready {
            color: limegreen;
        }

        /* ---------------- SCRAMBLE ---------------- */
        #myScramble {
            font-size: 16px;
            color: #444;
            margin-bottom: 10px;
            word-break: break-word;
        }

        /* ---------------- ROOM USERS ---------------- */
        #users {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }

        .box {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 12px;
            width: 220px;
            background: #fafafa;
            text-align: center;
        }

        .scramble {
            font-size: 13px;
            color: #444;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .time {
            font-size: 28px;
            font-weight: bold;
        }
        .small {
    font-size: 12px;
    color: #555;
}
    </style>
</head>

<body>

<h1>Room System</h1>

<input id="roomInput" placeholder="Room Code">
<button onclick="joinRoom()">Join Room</button>

<h3 id="roomStatus">No room</h3>

<hr>

<div id="myScramble">No scramble</div>
<div id="timer">0.00</div>

<br>

<button onclick="newScramble()">New Scramble</button>

<hr>

<h2>Room Users</h2>
<div id="users"></div>

<script src="/socket.io/socket.io.js"></script>
<script>


const socket = io();

/* ── STATE ── */
let state    = "idle";   // idle | arming | ready | running
let running  = false;
let armed    = false;
let startTime = 0;
let interval  = null;
let holdTimer = null;
let spaceDown = false;

/* ── SCRAMBLE ── */
function generateWCAScramble() {
    const axes  = { X: ["R", "L"], Y: ["U", "D"], Z: ["F", "B"] };
    const suffix    = ["", "'", "2"];
    const axisKeys  = Object.keys(axes);
    let scramble = [], lastAxis = null;
    for (let i = 0; i < 20; i++) {
        let axis;
        do { axis = axisKeys[Math.floor(Math.random() * axisKeys.length)]; }
        while (axis === lastAxis);
        lastAxis = axis;
        const move = axes[axis][Math.floor(Math.random() * 2)];
        const mod  = suffix[Math.floor(Math.random() * suffix.length)];
        scramble.push(move + mod);
    }
    return scramble.join(" ");
}

let myScramble = generateWCAScramble();
document.getElementById("myScramble").textContent = myScramble;

function newScramble() {
    myScramble = generateWCAScramble();
    document.getElementById("myScramble").textContent = myScramble;
    socket.emit("scrambleUpdate", { scramble: myScramble });
}

/* ── ROOM ── */
function joinRoom() {
    const room = document.getElementById("roomInput").value.trim();
    const name = prompt("Dein Name:");
    if (!room || !name) return;
    socket.emit("joinRoom", { roomId: room, name });
    document.getElementById("roomStatus").textContent = "Room: " + room + " | Name: " + name;
    document.getElementById("users").innerHTML = "";
}

/* ── STATS ── */
function calcAO5Local(arr) {
    if (arr.length < 5) return null;
    const last5  = [...arr].slice(-5).sort((a, b) => a - b);
    const middle = last5.slice(1, 4);
    return (middle.reduce((a, b) => a + b, 0) / 3).toFixed(2);
}

function calcAO12Local(arr) {
    if (arr.length < 12) return null;
    const last12 = [...arr].slice(-12).sort((a, b) => a - b);
    const middle = last12.slice(1, 11);
    return (middle.reduce((a, b) => a + b, 0) / 10).toFixed(2);
}

function bestTime(arr) {
    if (!arr.length) return null;
    return Math.min(...arr).toFixed(2);
}

/* ── RENDER USER ── */
// FIX: split into create + update so scramble is never lost
function renderUser(id, name, scramble, solves, ao5) {
    let el = document.getElementById("u_" + id);

    if (!el) {
        el = document.createElement("div");
        el.className = "box";
        el.id = "u_" + id;
        document.getElementById("users").appendChild(el);
    }

    // Keep existing scramble if we got an empty one (e.g. from solveUpdate)
    const currentScramble = el.dataset.scramble || "";
    const newScramble     = scramble || currentScramble;
    el.dataset.scramble   = newScramble;

    const solveList = (Array.isArray(solves) ? solves : []).map(s => Number(s).toFixed(2));
    const ao12      = calcAO12Local(solves || []);
    const best      = bestTime(solves || []);

    // Build the solve history table (last 5, newest first)
    const recentSolves = [...solveList].reverse().slice(0, 5);
    const solveRows = recentSolves.length
        ? recentSolves.map((t, i) => `
            <div style="display:flex;justify-content:space-between;font-size:12px;border-bottom:1px solid #ddd;padding:2px 0;">
                <span>#${solveList.length - i}</span>
                <span>${t}s</span>
            </div>`).join("")
        : `<div class="small">Noch keine Solves</div>`;

    el.innerHTML = `
        <b>${name || "Unknown"}</b>

        <div class="scramble">${newScramble || "–"}</div>

        <div style="margin:8px 0;">
            <div class="small" style="display:flex;justify-content:space-around;gap:8px;">
                <span><b>AO5:</b> ${ao5 ?? "–"}</span>
                <span><b>AO12:</b> ${ao12 ?? "–"}</span>
                <span><b>Best:</b> ${best ?? "–"}</span>
            </div>
        </div>

        <div style="font-size:12px;font-weight:bold;margin-bottom:4px;color:#333;">
            Letzte Solves
        </div>
        ${solveRows}
    `;
}

/* ── SOCKET EVENTS ── */
socket.on("scrambleUpdate", (data) => {
    const el = document.getElementById("u_" + data.id);
    if (!el) {
        renderUser(data.id, data.name, data.scramble, [], null);
        return;
    }
    // FIX: only update scramble, never touch solves
    el.dataset.scramble = data.scramble;
    const scrambleEl = el.querySelector(".scramble");
    if (scrambleEl) scrambleEl.textContent = data.scramble;
});

socket.on("solveUpdate", (data) => {
    const solves = data.solves || [];
    const ao5    = calcAO5Local(solves);
    // FIX: pass ao5 we calculated (server also sends it, both are fine)
    renderUser(data.id, data.name, "", solves, ao5 ?? data.ao5);
});

socket.on("initState", (data) => {
    for (const id in data.names) {
        const solves = data.solves[id] || [];
        const ao5    = calcAO5Local(solves);
        renderUser(id, data.names[id], data.scrambles[id] || "", solves, ao5);
    }
});

socket.on("removeUser", (id) => {
    const el = document.getElementById("u_" + id);
    if (el) el.remove();
});

/* ── TIMER ── */
function start() {
    if (running) return;
    running   = true;
    startTime = Date.now();
    const el  = document.getElementById("timer");
    el.classList.remove("ready", "arming");
    interval = setInterval(() => {
        const time = ((Date.now() - startTime) / 1000).toFixed(2);
        el.textContent = time;
        socket.emit("timeUpdate", time);
    }, 50);
}

function stop() {
    running = false;
    clearInterval(interval);
    interval = null;
    clearTimeout(holdTimer);
    document.getElementById("timer").classList.remove("ready", "arming");
    const finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
    document.getElementById("timer").textContent = finalTime;
    socket.emit("solveEnd", finalTime);
}

/* ── SPACEBAR ── */
document.addEventListener("keydown", (e) => {
    if (e.code !== "Space") return;
    if (e.repeat) return;
    e.preventDefault();
    spaceDown = true;

    if (running) { stop(); return; }

    const el = document.getElementById("timer");
    el.classList.add("arming");
    holdTimer = setTimeout(() => {
        armed = true;
        el.classList.remove("arming");
        el.classList.add("ready");
    }, 500);
});

document.addEventListener("keyup", (e) => {
    if (e.code !== "Space") return;
    e.preventDefault();
    spaceDown = false;
    clearTimeout(holdTimer);
    const el = document.getElementById("timer");
    el.classList.remove("arming");
    if (armed && !running) start();
    armed = false;
});

window.addEventListener("blur", () => { if (running) stop(); });
</script>

</body>
</html>
